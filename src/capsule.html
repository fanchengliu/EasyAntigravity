<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EasyAG 风险提示</title>
  <style>
    :root {
      color-scheme: dark light;
      --surface: #262626;
      --text: #f5f5f5;
      --muted: #b5b5b5;
      --subtle: #a3a3a3;
      --border: #414141;
      --control: #333333;
      --hover: #3d3d3d;
      --accent: #f0a09c;
    }
    * { box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; margin: 0; overflow: hidden;
      background: var(--surface); color: var(--text);
      font-family: "Segoe UI Variable", "Segoe UI", "Microsoft YaHei UI", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .notice {
      position: relative; width: 100%; height: 100%; padding: 14px 18px 15px;
      display: flex; flex-direction: column;
      border: 1px solid var(--border); border-radius: 10px;
      background: var(--surface);
      animation: enter 180ms ease-out both;
    }
    .notice.leaving { animation: leave 140ms ease-in both; }
    .notice.medium { --accent: #e8c281; }
    .notice.low, .notice.interaction { --accent: #95c6f5; }
    .notice.ready { --accent: #95cfaa; }
    .header { display: flex; align-items: center; gap: 9px; min-height: 24px; margin-bottom: 12px; }
    .app-mark { width: 21px; height: 21px; display: grid; place-items: center; color: var(--text); }
    .app-mark img { width: 21px; height: 21px; object-fit: contain; }
    .app-name { color: var(--muted); font-size: 12px; font-weight: 400; }
    .close {
      width: 26px; height: 26px; margin: -3px -6px -3px auto;
      border: 0; border-radius: 5px; background: transparent; color: var(--muted);
      cursor: pointer; font: 20px/1 "Segoe UI", sans-serif;
    }
    .close:hover { color: var(--text); background: var(--hover); }
    .title {
      margin: 0 0 7px; color: var(--text); font-size: 14px; font-weight: 600; line-height: 1.45;
      display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2;
      overflow: hidden; overflow-wrap: anywhere;
    }
    .section { min-height: 0; font-size: 12px; line-height: 1.5; }
    .section-label { display: none; }
    .section-value {
      display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2;
      overflow: hidden; color: var(--muted); overflow-wrap: anywhere;
    }
    .footer { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: auto; padding-top: 10px; }
    .risk-label { display: inline-flex; align-items: center; gap: 6px; color: var(--accent); font-size: 11px; white-space: nowrap; }
    .risk-dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
    .review {
      appearance: none; min-height: 30px; padding: 5px 14px;
      border: 1px solid var(--border); border-radius: 5px;
      background: var(--control); color: var(--text); cursor: pointer;
      font-size: 12px; line-height: 1.5; font-family: inherit; font-weight: 400;
    }
    .review:hover { background: var(--hover); }
    .review:active { opacity: .8; }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .timer { position: absolute; left: 18px; right: 18px; bottom: 0; height: 1px; overflow: hidden; }
    .timer::after {
      display: block; width: 100%; height: 100%; content: ""; background: var(--subtle); opacity: .35;
      transform-origin: left; animation: countdown var(--duration, 12s) linear forwards;
      animation-play-state: var(--timer-state, running);
    }
    @keyframes enter { from { opacity: 0; transform: translateY(5px); } }
    @keyframes leave { to { opacity: 0; } }
    @keyframes countdown { to { transform: scaleX(0); } }
    @media (prefers-color-scheme: light) {
      :root { --surface: #fafafa; --text: #202020; --muted: #616161; --subtle: #707070; --border: #dfdfdf; --control: #f0f0f0; --hover: #e8e8e8; --accent: #b42318; }
      .notice.medium { --accent: #895b08; }
      .notice.low, .notice.interaction { --accent: #0f6cbd; }
      .notice.ready { --accent: #217346; }
    }
    @media (prefers-reduced-motion: reduce) { .notice, .notice.leaving { animation-duration: 1ms; } }
    @media (forced-colors: active) { .notice, .review { border-color: ButtonText; } .risk-dot { forced-color-adjust: none; background: CanvasText; } }
  </style>
</head>
<body>
  <article class="notice" id="notice" role="status" aria-live="polite" aria-atomic="true">
    <header class="header">
      <span class="app-mark" aria-hidden="true"><img data-easyag-logo="32" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAYAAABzenr0AAAEU0lEQVR4nOxXbWhWZRi+nud8v1/ui9kGLTEFLbLQmFjmn4ISCpvUD8kglj+kUss/qyUxpDBpFdGHSEE1nIFBEYmQIUGBRSNkM5mTbLWvNtz3u73nPec8H93vAqHg3c47q/3xgpvncDjnvq/7uq/nOe/LscTgWGJcJ7DkBEwsAoc/eKP+Ftl9bHW252aMevr32TUXL+lVj+x5Z89FlAiGEvHKsdd33pP8qi0znWXWmAFnlMOd5PCz5fJM4t6tu48+83Up+Uoi8OxnbWvvznx+wZkNmTkBuBMMySkDiXGF9JRALiwXbWWbq1898tRE3JwljSBlDH48rj2mVYbMY8DjHGmuscyMIMwAmdA3bwtz79GjO+LmjE3g0RMnPDf57Z3D+XKIyIOhbDjMQJkhkbOIgOtDihzqgr6HUQJi74KUDlumpMNGZBWGxXL8oZZjiNVigGLIugFDZg1G7GpYUO5re9u3xc0bWwHtzOwYE1XIBWmEIg1IDyap4EMjzwJI24eQWUg9jWQU7aNXvoiTNxaBze0ny5XRc2PWr4AfLEMYZaBDGoN2EZGPC/PXFpFQU9AsBVfqjYiJWCNICWPfFBXNBpWYDarghxXISbpWFciySozzalyxqjHi1GKYIrCSif1NZ++KkzuWApEyH5J+JfL5CkRRGrKggHTBlUkD4NS1AjNIC+bSmoSkEEbicXr17L9DgIt1MqiACDIkcxm5nQpJB1obVNRAgAIBCmZT5KEND0rprXFyLziC9e+e3x5ErhkGhcIUeQ8QCSgyIYUvlJMX3EUeZEgjhWkzg3EjA2F5dZue6/eumYACbwxp5mJOespH0mvhfZ+fFlXnmp3ET822N6NkXaTtnsAokHCRMxOYNVOsZnnZroXyLzgCCWMLFw5YlPyruEz82Nls/81gPx9I9NOyZtMhdRmMrwQ3yBsCQuMJuv82FqvAmta++3VkpBUV14qKKy/bec4q6u6RSbY+1CwMqK8ctyi7efuGo9paNAHOeJOmeYMU0NKGEvxBfMpksed/Pczok8Sfjug6VBx5zY30pNo7X42iX8OyN3vLapR9hSvXNMjxgHOm63nrPsRA/SF1yWZYbVJ7Wum+H36JyAtqndYYDPPeKbSz6atNFktSK1PHmXZMTsctYIdDzGxATAQRa6D5z52S3YOijkGf3riStyYd9onr+ZfdJ/2b5iWw6uDYrbQ8wEl2RocNnSovjjaxLGKi8yV2QYK1T81oTPtq7t7BBgs1ywqCsyritbsogRUtva7jsdOGtBkn/zBtfdh1wGhFieh4ge2cDdTAiiqG8y87qF/JcWq/jcYthR2i1xYlkHYrv2HKquWapFfW8c5msxGLxMC42v7bqMaGlgAdvQrb3grx0XekDVh3UQKMmauoc8mk3dLVbD6Ga0D0vt1B3Z4MBf2W/FJgYEJDaT2a5/rI1Xr4z6GZsyug3aPuoF3Q/89d8D8QmB/X/xktOYE/AQAA//9qYpSQAAAABklEQVQDAFT014f9ZW3MAAAAAElFTkSuQmCC" width="21" height="21" alt=""></span>
      <span class="app-name">EasyAntigravity</span>
      <button class="close" type="button" aria-label="关闭提示" title="关闭">×</button>
    </header>
    <h1 class="title" id="title">命令需要人工确认</h1>
    <div class="section">
      <span class="section-label">可能后果</span>
      <span class="section-value" id="impact">可能对当前环境造成不可逆修改。</span>
    </div>
    <div class="footer">
      <div class="risk-label"><span class="risk-dot" aria-hidden="true"></span><span id="level">高风险命令</span></div>
      <button class="review" type="button" id="reviewBtn">前往审查</button>
    </div>
    <div class="timer"></div>
  </article>
  <script>
    const notice = document.getElementById('notice');
    let hideTimer = 0;
    let remaining = 12000;
    let startedAt = 0;
    let hovering = false;

    function hideWindow() {
      clearTimeout(hideTimer);
      hideTimer = 0;
      notice.classList.add('leaving');
      setTimeout(async function () {
        // HTTP notification pages use the backend's native window channel.
        // They do not need remote access to privileged Tauri commands.
        if (location.protocol === 'http:' || location.protocol === 'https:') {
          try {
            const response = await fetch('/api/notification/hide', { method: 'POST' });
            if (response.ok) return;
          } catch (e) {}
        }
        try {
          var t = window.__TAURI__;
          var win = t && (
            (t.window && t.window.getCurrentWindow && t.window.getCurrentWindow()) ||
            (t.webview && t.webview.getCurrentWebviewWindow && t.webview.getCurrentWebviewWindow()) ||
            (t.webviewWindow && t.webviewWindow.getCurrentWebviewWindow && t.webviewWindow.getCurrentWebviewWindow())
          );
          if (win && typeof win.hide === 'function') { win.hide(); return; }
        } catch (e) {}
        try { window.close(); } catch (e) {}
      }, 140);
    }

    function armTimer(ms) {
      clearTimeout(hideTimer);
      remaining = ms;
      startedAt = Date.now();
      notice.style.setProperty('--duration', ms + 'ms');
      notice.style.setProperty('--timer-state', 'running');
      hideTimer = setTimeout(hideWindow, ms);
    }

    function pauseTimer() {
      if (!hideTimer) return;
      remaining = Math.max(1200, remaining - (Date.now() - startedAt));
      clearTimeout(hideTimer);
      hideTimer = 0;
      notice.style.setProperty('--timer-state', 'paused');
    }

    function resumeTimer() {
      if (hideTimer) return;
      armTimer(remaining);
    }

    notice.addEventListener('mouseenter', function () {
      hovering = true;
      pauseTimer();
    });
    notice.addEventListener('mouseleave', function () {
      hovering = false;
      resumeTimer();
    });
    document.querySelector('.close').addEventListener('click', hideWindow);
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') hideWindow(); });

    // 前往审查：唤起 Antigravity（多通道投递，避免 app:// 跨源被拦）
    document.getElementById('reviewBtn').addEventListener('click', function () {
      var urls = [];
      try {
        if (location.protocol === 'http:' || location.protocol === 'https:') {
          urls.push(location.origin + '/api/focus-ag');
        }
      } catch (e) {}
      var port = window.__ea_port;
      if (port && port !== '0') urls.push('http://127.0.0.1:' + port + '/api/focus-ag');
      urls.push('http://127.0.0.1:19823/api/focus-ag');
      urls.push('/api/focus-ag');

      var sent = false;
      urls.forEach(function (u) {
        try {
          if (navigator.sendBeacon && navigator.sendBeacon(u)) sent = true;
        } catch (e) {}
        try {
          fetch(u, { method: 'POST', mode: 'no-cors', keepalive: true }).then(function () { sent = true; }).catch(function () {});
        } catch (e) {}
      });
      setTimeout(function () { hideWindow(); }, 80);
    });

    window.__ea_capsule = function (type, title, impact) {
      clearTimeout(hideTimer);
      hideTimer = 0;
      hovering = false;
      notice.className = 'notice';
      var isReady = type === 'ready';
      var isInteraction = type === 'interaction';
      var level = type === 'risk_low' ? 'low' : type === 'risk_medium' || type === 'interaction' ? 'medium' : isReady ? 'ready' : 'high';
      notice.classList.add(level);
      if (isInteraction) notice.classList.add('interaction');
      var labels = { high:'高风险命令', medium:'中风险命令', low:'低风险提醒', ready:'任务已完成' };
      document.getElementById('level').textContent = isInteraction ? '等待你的选择' : labels[level];
      document.getElementById('title').textContent = title || (isReady ? '本轮任务已完成' : isInteraction ? '有一个方案需要你选择' : '命令需要人工确认');
      document.getElementById('impact').textContent = impact || (isReady ? 'Agent 已空闲，可以检查结果。' : isInteraction ? '选择方案后，Antigravity 将继续执行。' : '该命令可能改变当前环境，请确认作用范围。');
      document.getElementById('reviewBtn').textContent = isReady ? '查看结果' : isInteraction ? '前往选择' : '前往审查';
      var duration = isReady ? 8000 : level === 'high' ? 18000 : level === 'medium' ? 15000 : 12000;
      var timer = document.querySelector('.timer');
      timer.replaceWith(timer.cloneNode(true));
      armTimer(duration);
    };
  </script>
</body>
</html>
