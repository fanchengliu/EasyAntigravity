  <style>
    :root {
      color-scheme: dark light;
      --bg: #202020;
      --card-bg: #282828;
      --card-border: #3b3b3b;
      --card-hover: #333333;
      --control: #303030;
      --primary: #95c6f5;
      --primary-hover: #acd2f7;
      --green: #95cfaa;
      --red: #f0a09c;
      --yellow: #e8c281;
      --text-main: #f3f3f3;
      --text-muted: #b5b5b5;
      --text-dark: #a3a3a3;
    }

    *, button, input, select, textarea {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Segoe UI Variable", "Segoe UI", "Microsoft YaHei UI", system-ui, sans-serif;
      user-select: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .console, .console *, .log-line, .copyable {
      user-select: text !important;
      -webkit-user-select: text !important;
      cursor: text;
    }
    
    html, body {
      height: 100%;
      margin: 0;
    }

    body {
      background: var(--bg);
      color: var(--text-main);
      width: 100%;
      height: 100%;
      min-width: 400px;
      min-height: 560px;
      padding: clamp(12px, 2.5vw, 22px) clamp(14px, 3vw, 24px);
      display: flex;
      flex-direction: column;
      gap: clamp(8px, 1.5vh, 14px);
      overflow-x: hidden;
      overflow-y: auto;
      box-sizing: border-box;
    }

    /* 顶部导航风格栏 */
    .nav-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 6px;
      flex-shrink: 0;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    .brand-icon { width: 32px; height: 32px; object-fit: contain; flex-shrink: 0; }
    .brand-title {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.2px;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .brand-sub {
      font-size: 10px;
      color: var(--text-dark);
      font-weight: 500;
    }

    /* 运行状态 */
    .status-capsule {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 9999px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      flex-shrink: 0;
      white-space: nowrap;
    }
    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--text-dark);
    }
    .status-capsule.active {
      color: var(--green);
      background: var(--card-bg);
      border-color: var(--card-border);
    }
    .status-capsule.active .dot {
      background: var(--green);
    }

    .tray-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 5px;
      background: var(--control);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      cursor: pointer;
      flex-shrink: 0;
      white-space: nowrap;
      transition: all 0.15s ease;
    }
    .tray-btn:hover {
      background: var(--card-hover);
      color: var(--text-main);
      border-color: var(--text-dark);
    }
    .tray-btn:active {
      transform: translateY(0);
    }

    /* 设置卡片 */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: clamp(10px, 1.6vh, 14px) clamp(12px, 2vw, 18px);
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: border-color 0.2s;
      flex-shrink: 0;
    }
    .card:hover {
      border-color: var(--card-border);
    }
    .card-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-main);
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px 12px;
      font-size: 12.5px;
      color: var(--text-main);
    }
    .row > span:first-child {
      min-width: 0;
      flex: 1 1 auto;
    }

    .mode-options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .mode-option {
      appearance: none;
      text-align: left;
      background: var(--control);
      border: 1px solid var(--card-border);
      border-radius: 6px;
      color: var(--text-main);
      padding: 10px;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s, transform 0.15s;
    }
    .mode-option:hover {
      border-color: var(--text-dark);
    }
    .mode-option.selected {
      border-color: var(--primary);
      background: var(--control);
    }
    .mode-option:disabled {
      cursor: default;
      opacity: 0.65;
      transform: none;
    }
    .mode-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      font-size: 12.5px;
      font-weight: 700;
    }
    .mode-badge {
      color: var(--primary);
      font-size: 9px;
      font-weight: 700;
    }
    .mode-desc {
      display: block;
      margin-top: 5px;
      color: var(--text-dark);
      font-size: 10.5px;
      line-height: 1.4;
    }
    .advisor-row.disabled {
      opacity: 0.45;
    }

    /* 端口与选项控件 */
    .port-cluster {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 5px;
      justify-content: flex-end;
    }
    .quick-tag {
      background: var(--control);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      border-radius: 6px;
      padding: 3px 8px;
      font-size: 11px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 3.5px;
    }
    .quick-tag .tag-hint {
      font-size: 9.5px;
      opacity: 0.65;
      font-weight: 400;
    }
    .quick-tag:hover {
      background: var(--card-hover);
      border-color: var(--text-dark);
      color: var(--text-main);
    }
    .quick-tag:hover .tag-hint {
      opacity: 0.9;
    }
    input[type="number"], input#proxyPortInput {
      background: var(--bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 5px 8px;
      border-radius: 6px;
      width: 78px;
      text-align: center;
      font-family: inherit;
      font-weight: 500;
      font-size: 11.5px;
      outline: none;
      transition: border-color 0.2s;
      -webkit-appearance: none;
      -moz-appearance: textfield;
      appearance: textfield;
    }
    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button,
    input#proxyPortInput::-webkit-outer-spin-button,
    input#proxyPortInput::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type="number"]:focus, input#proxyPortInput:focus {
      border-color: var(--primary);
    }

    select {
      background: var(--bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 5px 10px;
      border-radius: 6px;
      outline: none;
      font-family: inherit;
      font-size: 11.5px;
      cursor: pointer;
      max-width: 100%;
    }

    /* 开关 */
    .switch {
      position: relative;
      width: 40px;
      height: 22px;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute;
      inset: 0;
      cursor: pointer;
      background-color: var(--control);
      border: 1px solid var(--text-dark);
      border-radius: 9999px;
      transition: .25s ease;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 16px;
      width: 16px;
      left: 2px;
      bottom: 2px;
      background-color: var(--text-main);
      border-radius: 50%;
      transition: .25s cubic-bezier(0.4, 0, 0.2, 1);
    }
    input:checked + .slider {
      background-color: var(--primary);
      border-color: var(--primary);
    }
    input:checked + .slider:before {
      background: var(--bg);
    }
    input:checked + .slider:before {
      transform: translateX(18px);
    }

    /* 核心启动大按钮 */
    .launch-btn {
      background: var(--primary);
      border: none;
      border-radius: 6px;
      color: #132536;
      padding: 13px;
      font-size: 14.5px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      flex-shrink: 0;
      width: 100%;
    }
    .launch-btn:hover {
      background: var(--primary-hover);
    }
    .launch-btn:active {
      transform: translateY(0);
    }
    .launch-btn:disabled {
      background: var(--control);
      color: var(--text-dark);
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }
    .launch-btn.busy .launch-icon { animation: spin 900ms linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* 页面滚动条也收细，避免系统大灰条 */
    html, body { scrollbar-width: thin; scrollbar-color: rgba(148,163,184,0.28) transparent; }
    html::-webkit-scrollbar, body::-webkit-scrollbar, .advanced-body::-webkit-scrollbar { width: 6px; height: 6px; }
    html::-webkit-scrollbar-track, body::-webkit-scrollbar-track, .advanced-body::-webkit-scrollbar-track { background: transparent; }
    html::-webkit-scrollbar-thumb, body::-webkit-scrollbar-thumb, .advanced-body::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.28); border-radius: 999px;
    }

    /* 日志卡片：常显，不折叠 */
    .advanced {
      flex: 1 1 auto;
      min-height: 180px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      background: var(--card-bg);
    }
    .advanced-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 11px 13px;
      color: var(--text-muted);
      font-size: 11.5px;
      font-weight: 650;
    }
    .advanced-meta { margin-left: auto; color: var(--text-dark); font-size: 10px; font-weight: 500; }
    .advanced-body {
      flex: 1 1 auto;
      min-height: 0;
      padding: 0 11px 11px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow: hidden;
    }
    .advanced-tools { display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap; }

    /* 日志控制台 */
    .console-pane {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1 1 auto;
      min-height: 0;
      overflow: hidden;
    }
    .console-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 4px;
    }
    .clean-btn {
      background: none;
      border: none;
      color: var(--text-dark);
      font-size: 11px;
      cursor: pointer;
      transition: color 0.15s;
    }
    .clean-btn:hover { color: var(--text-main); }
    .console {
      flex: 1 1 auto;
      min-height: 90px;
      background: var(--bg);
      border: 1px solid var(--card-border);
      border-radius: 6px;
      padding: 10px 12px;
      font-family: ui-monospace, SFMono-Regular, "Cascadia Code", "JetBrains Mono", Consolas, monospace;
      font-size: 11px;
      overflow-y: auto;
      overflow-x: hidden;
      display: block;
      scrollbar-width: thin;
      scrollbar-color: rgba(148, 163, 184, 0.28) transparent;
    }
    .console::-webkit-scrollbar { width: 6px; height: 6px; }
    .console::-webkit-scrollbar-track { background: transparent; }
    .console::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.28);
      border-radius: 999px;
    }
    .console::-webkit-scrollbar-thumb:hover { background: rgba(148, 163, 184, 0.45); }
    .log-line {
      line-height: 1.45;
      word-break: break-all;
      color: var(--text-muted);
      margin: 0 0 5px;
    }
    .tag-proxy { color: var(--green); }
    .tag-aa { color: var(--primary); }
    .tag-i18n { color: var(--primary); }
    .tag-alert {
      color: var(--red);
      background: rgba(244, 63, 94, 0.08);
      border-left: 2px solid var(--red);
      padding-left: 6px;
      font-weight: 600;
    }
    .alert-glow {
      border-color: var(--red);
    }
    .tag-warn { color: var(--yellow); }
    .tag-mint { color: var(--primary); }

    /* 状态词强调 */
    .glow-on {
      color: var(--green) !important;
      font-weight: 600;
    }
    .glow-off {
      color: var(--text-muted) !important;
      font-weight: 600;
    }

    button:focus-visible,
    input:focus-visible,
    select:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 1ms !important; transition-duration: 1ms !important; }
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f3f3f3; --card-bg: #fdfdfd; --card-border: #dedede; --card-hover: #eaeaea;
        --control: #f5f5f5; --primary: #0f6cbd; --primary-hover: #115ea3;
        --green: #217346; --red: #b42318; --yellow: #895b08;
        --text-main: #202020; --text-muted: #616161; --text-dark: #707070;
      }
      .launch-btn { color: #fff; }
    }
    .console, .log-line { font-family: "Cascadia Code", Consolas, monospace; }
    .brand-sub { margin-top: 3px; font-size: 11px; }
    .dictionary-count { margin-left: 8px; color: var(--text-dark); font-size: 11px; }
    .switch input:focus-visible + .slider { outline: 2px solid var(--primary); outline-offset: 3px; }
  </style>
</head>

      <div>
        <div class="brand-title">EasyAG</div>
        <div class="brand-sub">Antigravity 助手</div>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:8px;">
      <button type="button" class="tray-btn" onclick="hideToTray()" title="收起至系统托盘，后台静默运行">
        <span>收起</span>
      </button>
      <div class="status-capsule" id="clientStatusBadge">
        <div class="dot"></div>
        <span>尚未启动</span>
      </div>
    </div>
  </div>

  <!-- 卡片 1: 原生代理 -->
  <div class="card">
    <div class="row">
      <span class="card-label">连接与界面</span>
      <span id="patchStatusBadge" style="font-weight: 600; color: var(--green);">● 本地代理就绪</span>
    </div>
    <div class="row">
      <label for="proxyPortInput" style="font-weight: 500;">代理端口</label>
      <div class="port-cluster">
        <button type="button" class="quick-tag" onclick="applyPort(7890)" title="7890: Mihomo / Clash 默认端口">
          7890 <span class="tag-hint">Mihomo</span>
        </button>
        <button type="button" class="quick-tag" onclick="applyPort(7897)" title="7897: Clash Verge / Verge Rev 默认端口">
          7897 <span class="tag-hint">Verge</span>
        </button>
        <button type="button" class="quick-tag" onclick="applyPort(10808)" title="10808: v2rayN / Xray 默认端口">
          10808 <span class="tag-hint">v2ray</span>
        </button>
        <input type="text" id="proxyPortInput" inputmode="numeric" pattern="[0-9]*" maxlength="5" value="7890" placeholder="7890">
      </div>
    </div>
    <div class="row">
      <span style="font-weight: 500;">界面汉化 <span id="dictCountBadge" class="dictionary-count">词典已载入</span></span>
      <label class="switch">
        <input type="checkbox" id="i18nToggle" aria-label="界面汉化" checked>
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <!-- 卡片 3: 启动模式 -->
  <div class="card">
    <div class="card-label">启动模式</div>
    <div class="mode-options" id="modeOptions">
      <button type="button" class="mode-option selected" data-mode="pilot" aria-pressed="true" onclick="selectLaunchMode('pilot')">
        <span class="mode-title">Turbo Pilot <span class="mode-badge">推荐</span></span>
        <span class="mode-desc">自动审批 + 高危命令拦截</span>
      </button>
      <button type="button" class="mode-option" data-mode="compatibility" aria-pressed="false" onclick="selectLaunchMode('compatibility')">
        <span class="mode-title">兼容模式</span>
        <span class="mode-desc">沿用用户默认审批设置</span>

        <span class="slider"></span>
      </label>

  <!-- 核心启动按钮 -->
  <button class="launch-btn" id="launchBtn" onclick="launchClient()">
    <span class="launch-icon" id="launchIcon" aria-hidden="true">▷</span>
    <span id="launchText">启动 Antigravity</span>
  </button>

  <!-- 运行日志：常显卡片，不折叠 -->
  <div class="advanced" id="advancedPanel">
    <div class="advanced-head">
      <span>运行日志</span>
      <span class="advanced-meta"><span id="approveCountBadge">风险 0</span> · <span id="rulesCountBadge">--</span> · <span id="kbCountBadge">KB --</span></span>
    </div>
    <div class="advanced-body">
      <div class="advanced-tools">
        <div class="port-cluster">
          <button type="button" class="quick-tag" onclick="openRules()">打开规则</button>
          <button type="button" class="quick-tag" onclick="reloadRules()">重载规则</button>
          <button type="button" class="quick-tag" onclick="cleanupRules()">恢复原设置</button>
        </div>
        <div style="display:flex;gap:8px;align-items:center;">
          <button type="button" class="clean-btn" onclick="previewNotification()">预览通知</button>
          <button type="button" class="clean-btn" onclick="copyLogs()">复制日志</button>
          <button type="button" class="clean-btn" onclick="document.getElementById('consoleBox').innerHTML=''">清空</button>
        </div>
      </div>
      <div class="console-pane">
        <div class="console" id="consoleBox">
          <div class="log-line" style="color: var(--text-dark);">[SYSTEM] EasyAG 已就绪。</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const consoleBox = document.getElementById('consoleBox');

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function formatLogMsg(msg) {
      const safe = escapeHtml(msg);
      return safe
        .replace(/(已开启|已启用|开启|启用)/g, '<span class="glow-on">$1</span>')
        .replace(/(已停用|停用)/g, '<span class="glow-off">$1</span>');
    }

    function appendLog(category, msg, styleClass) {
      if (category == null && msg == null) return;
      if (category === undefined || category === null || category === '') category = 'SYSTEM';
      if (msg === undefined || msg === null) msg = '';
      const time = new Date().toLocaleTimeString();
      const div = document.createElement('div');
      div.className = `log-line ${styleClass || ''}`;
      div.innerHTML = `[${time}] [${escapeHtml(category)}] ${formatLogMsg(msg)}`;
      consoleBox.appendChild(div);
      consoleBox.scrollTop = consoleBox.scrollHeight;
      if (styleClass === 'tag-alert' || category === 'SECURITY ALERT') {
        consoleBox.classList.remove('alert-glow');
        void consoleBox.offsetWidth;
        consoleBox.classList.add('alert-glow');
      }
    }

    async function init() {
      const res = await fetch('/api/status');
      const d = await res.json();
      
      document.getElementById('patchStatusBadge').innerText = '● 原生代理已就绪';
      document.getElementById('patchStatusBadge').style.color = 'var(--green)';
      document.getElementById('proxyPortInput').value = d.port;
      
      selectLaunchMode(d.launchMode || (d.blockDangerous === false ? 'compatibility' : 'pilot'), false);
      document.getElementById('riskAdvisorToggle').checked = d.riskAdvisor !== false;
      updateAdvisorAvailability();

      document.getElementById('i18nToggle').checked = d.enableI18n;
      document.getElementById('dictCountBadge').innerText = `已载入 ${d.dictEntries} 条汉化词条`;
      refreshRulesBadge(d.dangerRulesOn, d.dangerRulesTotal);
      refreshClientBadge(d);
      updateLaunchBtn(d.clientRunning);
      if (typeof d.approveCount === 'number' || typeof d.blockCount === 'number') {
        refreshApproveBadge(d.riskHits || 0);
      }

      const evt = new EventSource('/api/events');
      evt.onmessage = (e) => {
        const item = JSON.parse(e.data);
        if (item.counters) {
          refreshApproveBadge(item.riskHits || 0);
        }
        if (item.dangerRules) {
          refreshRulesBadge(item.dangerRulesOn, item.dangerRulesTotal);
        }
        if (item.status) {
          refreshClientBadge(item);
          updateLaunchBtn(item.clientRunning);
        }
        if (item.category || item.message) {
          appendLog(item.category, item.message, item.cls);
        }
      };

      // SSE 在 WebView 里可能晚连/丢帧：启动时用 HTTP 把历史日志补进控制台
      try {
        const hist = await (await fetch('/api/logs?limit=200')).json();
        if (Array.isArray(hist) && hist.length) {
          const seen = new Set();
          for (const item of hist) {
            const key = (item.at || '') + '|' + (item.category || '') + '|' + (item.message || '');
            if (seen.has(key)) continue;
            seen.add(key);
            appendLog(item.category, item.message, item.cls);
          }
        }
      } catch (e) {}

      setInterval(async () => {
        try {
          const res = await fetch('/api/status');
          const d = await res.json();
          refreshClientBadge(d);
          updateLaunchBtn(d.clientRunning);
          refreshApproveBadge(d.riskHits || 0);
          refreshRulesBadge(d.dangerRulesOn, d.dangerRulesTotal);
        } catch (e) {}
      }, 3000);

      // 原生窗口负责退出，页面刷新/后台节流不能结束进程。
    }

    function refreshClientBadge(d) {
      const badge = document.getElementById('clientStatusBadge');
      if (!badge || !d) return;
      let text = '尚未启动';
      let active = false;
      if (d.clientRunning) {
        const socks = d.cdpSockets || 0;
        if (socks > 0) {
          text = '运行中';
          active = true;
        } else {
          text = d.cdpError ? '连接需要检查' : '正在连接';
          active = true;
        }
      } else if (typeof d.status === 'string' && d.status) {
        text = d.status;
        active = d.status.includes('运行中');
      }
      badge.className = active ? 'status-capsule active' : 'status-capsule';
      badge.querySelector('span').innerText = text;
      badge.title = d.cdpError || (d.clientRunning ? 'Antigravity 已启动' : 'Antigravity 尚未启动');
    }

    function applyPort(val) {
      document.getElementById('proxyPortInput').value = val;
      updateConfig();
    }

    let selectedLaunchMode = 'pilot';
    let uiState = 'idle';

    function selectLaunchMode(mode, persist = true) {
      selectedLaunchMode = mode === 'compatibility' ? 'compatibility' : 'pilot';
      document.querySelectorAll('.mode-option').forEach(el => {
        const selected = el.dataset.mode === selectedLaunchMode;
        el.classList.toggle('selected', selected);
        el.setAttribute('aria-pressed', selected ? 'true' : 'false');
      });
      updateAdvisorAvailability();
      updateLaunchBtn(false);
      if (persist) updateConfig();
    }

    function updateAdvisorAvailability() {
      const enabled = selectedLaunchMode === 'pilot';
      const toggle = document.getElementById('riskAdvisorToggle');
      const row = document.getElementById('advisorRow');
      if (toggle) toggle.disabled = !enabled;
      if (row) row.classList.toggle('disabled', !enabled);
    }

    function refreshApproveBadge(risk, block) {
      const el = document.getElementById('approveCountBadge');
      if (!el) return;
      el.innerText = '风险 ' + (risk || 0);
    }

    function refreshRulesBadge(on, total) {
      const el = document.getElementById('rulesCountBadge');
      if (!el) return;
      const a = (on == null) ? '--' : on;
      const t = (total == null) ? '--' : total;
      el.innerText = `${a}/${t} 条生效`;
      el.style.color = (on === 0) ? 'var(--text-dark)' : 'var(--yellow)';
    }

    async function openRules() {
      try {
        const r = await fetch('/api/danger-rules/open', { method: 'POST' });
        let d = null;
        try { d = await r.json(); } catch (_) {}
        if (!r.ok || (d && d.ok === false)) {
          const msg = (d && d.error) || ('HTTP ' + r.status);
          appendLog('SECURITY', '打开规则失败: ' + msg, 'tag-alert');
          return;
        }
        appendLog('SECURITY', '已打开 danger-rules.json（路径: ' + ((d && d.path) || 'exe同目录') + '）', 'tag-proxy');
      } catch (e) {
        appendLog('SECURITY', '打开规则失败: ' + (e && e.message ? e.message : e), 'tag-alert');
      }
    }

    async function reloadRules() {
      try {
        const r = await fetch('/api/danger-rules/reload', { method: 'POST' });
        const d = await r.json();
        if (!r.ok) {
          appendLog('SECURITY', '规则重载失败: HTTP ' + r.status, 'tag-alert');
          return;
        }
        refreshRulesBadge(d.active, d.total);
        appendLog('SECURITY', `规则重载完成：${d.active}/${d.total} 条生效`, 'tag-proxy');
      } catch (e) {
        appendLog('SECURITY', '规则重载失败: ' + (e && e.message ? e.message : e), 'tag-alert');
      }
    }

    async function cleanupRules() {
      try {
        const r = await fetch('/api/danger-rules/cleanup', { method: 'POST' });
        const d = await r.json();
        if (!r.ok || d.ok === false) {
          appendLog('SECURITY', '清理注入失败: ' + (d.error || ('HTTP ' + r.status)), 'tag-alert');
          return;
        }
        appendLog('SECURITY', '已清理注入 ' + (d.removed || 0) + ' 条' + (d.restored ? '，策略已恢复' : ''), 'tag-proxy');
      } catch (e) {
        appendLog('SECURITY', '清理注入失败: ' + (e && e.message ? e.message : e), 'tag-alert');
      }
    }

    async function previewNotification() {
      try {
        const response = await fetch('/api/notification/preview', { method: 'POST' });
        if (!response.ok) throw new Error('HTTP ' + response.status);
      } catch (error) {
        appendLog('SYSTEM', '通知预览失败: ' + error.message, 'tag-warn');
      }
    }

    async function copyLogs() {
      const box = document.getElementById('consoleBox');
      const text = box.innerText || '';
      try {
        await navigator.clipboard.writeText(text);
        appendLog('SYSTEM', '日志已复制到剪贴板', 'tag-proxy');
      } catch (e) {
        // 降级：选中全文
        const sel = window.getSelection();
        const range = document.createRange();
        range.selectNodeContents(box);
        sel.removeAllRanges();
        sel.addRange(range);
        try { document.execCommand('copy'); appendLog('SYSTEM', '日志已复制（降级）', 'tag-proxy'); }
        catch (e2) { appendLog('SYSTEM', '复制失败，请手动选中日志后 Ctrl+C', 'tag-warn'); }
      }
    }

    async function updateConfig() {
      const portVal = parseInt(document.getElementById('proxyPortInput').value, 10);
      const payload = {
        port: (portVal >= 1 && portVal <= 65535) ? portVal : 7890,
        launchMode: selectedLaunchMode,
        riskAdvisor: document.getElementById('riskAdvisorToggle').checked,
        enableI18n: document.getElementById('i18nToggle').checked
      };
      return fetch('/api/config', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
    }

    const portEl = document.getElementById('proxyPortInput');
    portEl.oninput = function() {
      this.value = this.value.replace(/\D/g, '');
    };
    portEl.onchange = updateConfig;
    document.getElementById('riskAdvisorToggle').onchange = updateConfig;
    document.getElementById('i18nToggle').onchange = updateConfig;

    function updateLaunchBtn(clientRunning) {
      const btn = document.getElementById('launchBtn');
      if (!btn) return;
      if (clientRunning) {
        setUiState('running');
      } else if (uiState === 'running') {
        setUiState('idle');
      } else if (uiState !== 'preparing' && uiState !== 'launching') {
        setUiState(uiState === 'error' ? 'error' : 'idle');
      }
    }

    function setUiState(next) {
      uiState = next;
      document.body.dataset.uiState = next;
      const btn = document.getElementById('launchBtn');
      const icon = document.getElementById('launchIcon');
      const text = document.getElementById('launchText');
      const busy = next === 'preparing' || next === 'launching';
      const locked = busy || next === 'running';
      btn.disabled = locked;
      btn.classList.toggle('busy', busy);
      document.querySelectorAll('.mode-option').forEach(el => { el.disabled = locked; });
      document.getElementById('proxyPortInput').disabled = locked;
      icon.textContent = busy ? '◌' : next === 'running' ? '✓' : next === 'error' ? '↻' : '▷';
      if (next === 'preparing') text.textContent = '正在准备增强环境…';
      else if (next === 'launching') text.textContent = '正在启动 Antigravity…';
      else if (next === 'running') text.textContent = 'Antigravity 运行中';
      else if (next === 'error') text.textContent = '启动失败，点击重试';
      else text.textContent = selectedLaunchMode === 'pilot' ? '以 Turbo Pilot 启动' : '以兼容模式启动';
      btn.style.background = '';
    }

    async function launchClient() {
      setUiState('preparing');
      try {
        await updateConfig();
        setUiState('launching');
        const r = await fetch('/api/launch', { method: 'POST' });
        let d = null;
        try { d = await r.json(); } catch (_) {}
        if (!r.ok || !d || d.ok === false) {
          appendLog('SECURITY', '启动失败: ' + ((d && d.error) || ('HTTP ' + r.status)), 'tag-alert');
          setUiState('error');
          return;
        }
        if (d.pilot && !d.pilot.skipped) {
          appendLog('SECURITY', '启动前校验通过：Turbo + 高危 ASK ' + (d.pilot.count || 0) + ' 条', 'tag-proxy');
        }
        if (d.alreadyRunning) setUiState('running');
        // 启动成功后收起面板（托盘静默）；后端也会发 hide，这里再兜一次
        setTimeout(() => { hideToTray(); }, 400);
      } catch (e) {
        appendLog('SYSTEM', '启动失败: ' + (e && e.message ? e.message : e), 'tag-alert');
        setUiState('error');
      }
    }

    async function hideToTray() {
      try {
        await fetch('/api/hide', { method: 'POST' });
      } catch (e) {}
    }

    init();

    (function enforceMinSize() {
      const MIN_W = 400, MIN_H = 560;
      function fit() {
        const w = document.documentElement.clientWidth;
        const h = document.documentElement.clientHeight;
        if (w > 0 && w < MIN_W) {
          document.body.style.minWidth = MIN_W + 'px';
          document.documentElement.style.minWidth = MIN_W + 'px';
        }
        if (h > 0 && h < MIN_H) {
          document.body.style.minHeight = MIN_H + 'px';
          document.documentElement.style.minHeight = MIN_H + 'px';
        }
      }
      window.addEventListener('resize', fit);
      fit();
    })();
  </script>
</body>
</html>
